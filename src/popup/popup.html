<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LK Tracker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>LK Tracker</h1>
      <div class="header-actions">
        <button
          type="button"
          id="open-side-panel"
          class="btn-icon"
          title="Ouvrir en panneau latéral (Chrome)"
          aria-label="Ouvrir en panneau latéral"
          hidden
        >
          ▤
        </button>
        <button
          type="button"
          id="open-panel-window"
          class="btn-icon"
          title="Détacher en fenêtre (reste ouverte, redimensionnable)"
          aria-label="Détacher en fenêtre"
        >
          ⧉
        </button>
        <label class="toggle">
          <input type="checkbox" id="tracking-toggle" />
          <span class="slider"></span>
          <span class="toggle-label" id="toggle-label">Off</span>
        </label>
      </div>
    </header>

    <div class="popup-content">
      <section id="current-profile-section" class="current-profile" hidden>
        <h2>Profil détecté</h2>
        <div class="current-profile-card">
          <img id="current-profile-photo" class="current-profile-photo" alt="" hidden />
          <div id="current-profile-photo-placeholder" class="current-profile-photo placeholder" hidden></div>
          <div class="current-profile-info">
            <div id="current-profile-name" class="current-profile-name"></div>
            <div id="current-profile-job" class="current-profile-job"></div>
            <div id="current-profile-location" class="current-profile-location"></div>
          </div>
        </div>
        <div class="current-profile-actions">
          <button type="button" id="add-current-profile" class="btn btn-primary">
            Ajouter à la liste
          </button>
          <button type="button" id="copy-profile-for-ai" class="btn btn-secondary">
            Copier pour IA
          </button>
        </div>
        <p id="current-profile-hint" class="current-profile-hint" hidden></p>
      </section>

      <p id="no-profile-hint" class="no-profile-hint" hidden>
        Ouvre un profil LinkedIn (<code>/in/nom</code>) pour voir le prospect détecté.
      </p>

      <section class="actions">
        <button type="button" id="sync-connections" class="btn btn-secondary">
          Sync connexions
        </button>
        <button type="button" id="sync-messages" class="btn btn-secondary">
          Sync messages
        </button>
        <button type="button" id="sync-sheet" class="btn btn-secondary">
          Sync sheet
        </button>
        <button type="button" id="export-excel" class="btn btn-primary">
          Export Excel
        </button>
      </section>

      <section class="prospects">
        <h2>Prospects (<span id="prospect-count">0</span>)</h2>
        <ul id="prospect-list"></ul>
      </section>

      <details class="popup-settings">
        <summary>Paramètres & Google Sheet</summary>
        <section class="sheets">
          <h2>Google Sheet</h2>
          <label for="spreadsheet-id">URL ou ID du sheet</label>
          <input type="text" id="spreadsheet-id" placeholder="https://docs.google.com/spreadsheets/d/..." />

          <label for="sheet-tab-name">Nom de l'onglet</label>
          <input type="text" id="sheet-tab-name" value="Feuille 1" placeholder="Feuille 1 ou Sheet1" />

          <div class="sheets-actions">
            <button type="button" id="google-connect" class="btn btn-primary">Connecter Google</button>
            <button type="button" id="google-disconnect" class="btn btn-secondary" hidden>
              Déconnecter
            </button>
          </div>
          <p id="sheets-status" class="sheets-status">Non connecté</p>
          <p id="extension-id-hint" class="extension-id-hint">
            ID extension (OAuth Chrome Extension — Google Chrome) :
            <code id="extension-id"></code>
          </p>
          <p id="oauth-redirect-hint" class="extension-id-hint">
            URI de redirection (OAuth Web application — Arc/Brave) :
            <code id="oauth-redirect-uri"></code>
          </p>
        </section>

        <section class="settings">
          <label for="follow-up-days">Relance après (jours)</label>
          <input type="number" id="follow-up-days" min="1" max="30" value="3" />
        </section>
      </details>
    </div>

    <p id="status-message" class="status-message" hidden></p>

    <script src="popup.js"></script>
  </body>
</html>
